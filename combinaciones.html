<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combinaciones de botones</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <h1>Prueba de combinaciones</h1>
  <p><a href="index.html">Volver al catálogo</a></p>

  <div class="demo">
    <button type="button" class="btn btn-primary btn-pill btn-grow">Guardar</button>
    <button type="button" class="btn btn-success btn-large btn-lift">Continuar</button>
    <button type="button" class="btn btn-danger btn-rounded btn-hover-shadow">Eliminar</button>
    <button type="button" class="btn btn-outline btn-small btn-hover-background">Cancelar</button>
    <button type="button" class="btn btn-gradient-ocean btn-pill btn-glow-pulse">Explorar</button>
  </div>

  <ol>
    <li>btn btn-primary btn-pill btn-grow</li>
    <li>btn btn-success btn-large btn-lift</li>
    <li>btn btn-danger btn-rounded btn-hover-shadow</li>
    <li>btn btn-outline btn-small btn-hover-background</li>

  </ol>
